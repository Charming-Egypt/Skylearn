<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>


<title>Discover Sharm Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--r:#ff2d00;--o:#f86a09;--y:#ffb800;--bg:#130c07;--tx:#fff4e4;--glass:rgba(22,13,7,.62);--line:rgba(255,160,40,.38);--grad:linear-gradient(90deg,var(--r),var(--o) 55%,var(--y))}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font-family:Cairo,system-ui,"Segoe UI",Tahoma,Roboto,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block}
.glass{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.38)}
.txt{unicode-bidi:plaintext}
body.rtl .rt{direction:rtl;text-align:right}
button{font-family:inherit;color:inherit}
kbd{display:inline-block;min-width:24px;text-align:center;background:var(--grad);color:#1a0d04;border-radius:6px;padding:1px 7px;font:800 12px Cairo,system-ui;margin:0 2px}
#hud>*{position:fixed}
#dlg,#toast,#lower{position:fixed}
body.pre #hud,body.pre #touch,body.pre #help{display:none!important}
#quest{left:12px;top:calc(12px + env(safe-area-inset-top,0px));width:min(350px,calc(100vw - 190px));padding:12px 15px}
#quest small{color:var(--y);font-size:11px;letter-spacing:.08em;font-weight:700;text-transform:uppercase}
#quest h2{margin:2px 0 2px;font-size:17px;line-height:1.25;font-weight:800}
#quest p{margin:0;font-size:13px;line-height:1.4;opacity:.9}
#qd{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13px;font-weight:700;color:var(--y)}
#arrow{display:inline-block;transition:transform .1s;font-size:18px;line-height:1}
.bar{height:4px;margin-top:8px;border-radius:3px;background:rgba(255,255,255,.15);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--grad);transition:width .5s}
#side{right:12px;top:calc(12px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;align-items:flex-end;gap:8px}
#mini{padding:5px;border-radius:18px;cursor:pointer}
#mm{display:block;width:150px;height:150px;border-radius:13px}
#tools{display:grid;grid-template-columns:repeat(4,38px);gap:6px}
.tb{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.tb:active,.tb.on{background:var(--grad);color:#1a0d04}
#prompt{left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);padding:9px 18px;font-size:15px;font-weight:600;white-space:nowrap;display:none;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
#card{left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));width:min(480px,calc(100vw - 24px));transform:translate(-50%,24px);padding:14px 18px;opacity:0;pointer-events:none;transition:.35s}
#card.on{opacity:1;transform:translate(-50%,0);pointer-events:auto;cursor:pointer}
#card h3{margin:0 0 4px;font-size:18px;color:var(--y);font-weight:800}
#card p{margin:0;font-size:14px;line-height:1.5}
#speed{right:14px;bottom:calc(22px + env(safe-area-inset-bottom,0px));padding:6px 14px;font-size:22px;font-weight:800;display:none}
#speed span{font-size:12px;opacity:.7;margin:0 4px}
#pax{left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);padding:6px 14px;font-size:13px;font-weight:700;display:none}
#dlg{left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);width:min(720px,calc(100vw - 20px));padding:14px 18px 12px;opacity:0;pointer-events:none;transition:.28s;z-index:20}
#dlg.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#dn{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px;color:var(--y)}
#dn i{font-style:normal;font-size:11px;font-weight:700;color:#1a0d04;background:var(--grad);border-radius:99px;padding:1px 9px}
#dt{margin:6px 0 0;font-size:18px;line-height:1.5;min-height:54px;font-weight:600}
#dsub{margin:4px 0 0;font-size:13px;line-height:1.45;opacity:.78;font-style:italic}
#dch{display:flex;flex-direction:column;gap:6px;margin-top:10px}
#dch button,#dnext{border:1px solid var(--line);background:rgba(255,160,40,.12);border-radius:12px;padding:9px 14px;font-size:15px;font-weight:700;cursor:pointer;text-align:start}
#dch button:hover,#dnext:hover{background:rgba(255,160,40,.28)}
#dnext{margin-top:8px;float:right;background:var(--grad);color:#1a0d04;border:0}
body.rtl #dnext{float:left}
#touch{display:none}
body.touch #touch{display:block}
#joy{position:fixed;left:calc(18px + env(safe-area-inset-left,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));width:132px;height:132px;border-radius:50%;background:rgba(255,160,40,.14);border:2px solid var(--line);touch-action:none;z-index:15}
#knob{position:absolute;left:41px;top:41px;width:50px;height:50px;border-radius:50%;background:var(--grad);box-shadow:0 4px 14px rgba(0,0,0,.45);pointer-events:none}
.tbtn{position:fixed;border-radius:50%;border:2px solid var(--line);background:rgba(22,13,7,.6);color:var(--tx);font-weight:800;display:flex;align-items:center;justify-content:center;touch-action:none;z-index:15;font-size:13px;text-align:center;line-height:1.1;padding:0}
.tbtn.big{width:74px;height:74px;right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(30px + env(safe-area-inset-bottom,0px));background:var(--grad);color:#1a0d04;font-size:15px}
#bJump{width:58px;height:58px;right:calc(106px + env(safe-area-inset-right,0px));bottom:calc(24px + env(safe-area-inset-bottom,0px))}
#bRun{width:52px;height:52px;right:calc(28px + env(safe-area-inset-right,0px));bottom:calc(118px + env(safe-area-inset-bottom,0px))}
.tbtn.held{background:var(--grad);color:#1a0d04}
body.touch #help{display:none}
#help{left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));padding:8px 12px;font-size:12px;line-height:1.8;opacity:.9}
#start,#how,#mapov{position:fixed;inset:0;z-index:30}
#how,#mapov{z-index:35}
#start{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:18px;gap:10px;overflow:auto;background:radial-gradient(120% 90% at 50% 0%,rgba(248,106,9,.35),transparent 55%),linear-gradient(180deg,rgba(19,12,7,.35),rgba(19,12,7,.93))}
#start .logo{width:min(560px,86vw);filter:drop-shadow(0 8px 24px rgba(0,0,0,.5))}
#start p{max-width:520px;line-height:1.6;opacity:.92;margin:4px 0;font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chip{border:1px solid var(--line);background:var(--glass);border-radius:99px;padding:6px 14px;font-size:14px;font-weight:700;cursor:pointer}
.chip.on{background:var(--grad);color:#1a0d04;border-color:transparent}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:6px}
.btn{border:0;border-radius:999px;padding:13px 30px;font-size:17px;font-weight:800;cursor:pointer;background:var(--grad);color:#1a0d04;box-shadow:0 8px 24px rgba(248,106,9,.35)}
.btn.sec{background:var(--glass);color:var(--tx);border:1px solid var(--line);box-shadow:none}
.btn:focus-visible,.chip:focus-visible,.tb:focus-visible{outline:3px solid #fff;outline-offset:3px}
.gal{display:flex;gap:10px;margin-top:8px;justify-content:center}
.gal img{height:clamp(70px,16vh,130px);border-radius:12px;border:1px solid var(--line);object-fit:cover}
#how{display:none;align-items:center;justify-content:center;background:rgba(10,6,3,.82);padding:14px}
#how .box{width:min(760px,100%);max-height:94vh;overflow:auto;padding:20px 22px}
#how h2{margin:0 0 10px;font-size:22px;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
#how ul{list-style:none;margin:12px 0;padding:0;display:grid;gap:8px}
#how li{display:flex;gap:12px;align-items:center;font-size:15px;line-height:1.4;background:rgba(255,160,40,.08);border-radius:12px;padding:8px 12px}
#how li b{flex:0 0 auto;min-width:92px;text-align:center}
.ico{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:34px;border-radius:10px;background:var(--grad);color:#1a0d04;font-weight:800;font-size:13px;padding:0 8px}
#mapov{display:none;background:rgba(10,6,3,.88);align-items:center;justify-content:center;flex-direction:column;gap:8px;padding:12px}
#mapc{width:min(94vw,calc(94vh*.82));height:min(94vh - 70px,calc(94vw*1.22));border-radius:16px;border:1px solid var(--line);touch-action:none}
#lower{left:calc(24px + env(safe-area-inset-left,0px));bottom:calc(34px + env(safe-area-inset-bottom,0px));display:none;align-items:center;gap:14px;z-index:12;pointer-events:none}
#lower img{height:54px}
#lower .tt{font-size:clamp(20px,4.4vw,34px);font-weight:800;text-shadow:0 3px 14px rgba(0,0,0,.7);line-height:1.1}
#lower .ss{font-size:clamp(12px,2.4vw,17px);opacity:.92;text-shadow:0 2px 8px rgba(0,0,0,.7);max-width:min(560px,70vw)}
#endcard{inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:radial-gradient(100% 80% at 50% 40%,rgba(248,106,9,.4),rgba(19,12,7,.94));z-index:25;text-align:center;padding:20px}
#endcard img{width:min(520px,84vw)}
#endcard .tg{font-size:clamp(18px,4vw,30px);font-weight:800}
#flash{inset:0;background:#fff;opacity:0;pointer-events:none;z-index:40;transition:opacity .6s}
#rec{right:14px;bottom:calc(86px + env(safe-area-inset-bottom,0px));display:none;padding:5px 12px;font-size:13px;font-weight:800;color:#fff}
#rec:before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:#ff2d00;margin-inline-end:7px;animation:bl 1s infinite}
@keyframes bl{50%{opacity:.2}}
#toast{left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translateX(-50%);padding:8px 16px;font-size:14px;font-weight:700;opacity:0;transition:.3s;pointer-events:none;z-index:50;white-space:nowrap}
#toast.on{opacity:1}
#loading{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-weight:700}
#loading .bar{width:220px}
body.nohud #hud,body.nohud #touch,body.nohud #help{display:none!important}
@media(max-width:640px){#mm{width:112px;height:112px}#quest{width:calc(100vw - 150px);padding:9px 11px}#quest h2{font-size:15px}#quest p{display:none}#help{display:none}#tools{grid-template-columns:repeat(4,34px)}.tb{width:34px;height:34px;font-size:15px}#dt{font-size:16px}}
@media(max-height:520px){body.touch #bRun{right:calc(176px + env(safe-area-inset-right,0px));bottom:calc(34px + env(safe-area-inset-bottom,0px))}body.touch #card{width:min(380px,calc(100vw - 460px));bottom:calc(10px + env(safe-area-inset-bottom,0px));padding:8px 12px}#card h3{font-size:15px}#card p{font-size:12px;line-height:1.35}#start .logo{width:min(300px,50vw)}.gal{display:none}#start p{font-size:14px}}
</style>

function catmull(pts,sub){const o=[];for(let i=0;i<pts.length-1;i++){const p0=pts[Math.max(0,i-1)],p1=pts[i],p2=pts[i+1],p3=pts[Math.min(pts.length-1,i+2)];for(let s=0;s<sub;s++){const t=s/sub,t2=t*t,t3=t2*t;o.push([.5*((2*p1[0])+(-p0[0]+p2[0])*t+(2*p0[0]-5*p1[0]+4*p2[0]-p3[0])*t2+(-p0[0]+3*p1[0]-3*p2[0]+p3[0])*t3),.5*((2*p1[1])+(-p0[1]+p2[1])*t+(2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*t2+(-p0[1]+3*p1[1]-3*p2[1]+p3[1])*t3)])}}o.push(pts[pts.length-1]);return o}

const CELL=10,GW=Math.ceil(WW/CELL),GH=Math.ceil(WH/CELL);
const SDF=new Float32Array(GW*GH);
(function buildSDF(){
 const c=document.createElement('canvas');c.width=GW;c.height=GH;const g=c.getContext('2d');g.fillStyle='#000';g.fillRect(0,0,GW,GH);g.fillStyle='#fff';g.beginPath();LAND.forEach((p,i)=>{const x=(p[0]-WX0)/CELL,y=(p[1]-WZ0)/CELL;i?g.lineTo(x,y):g.moveTo(x,y)});g.closePath();g.fill();
 const px=g.getImageData(0,0,GW,GH).data,land=new Uint8Array(GW*GH);for(let i=0;i<land.length;i++)land[i]=px[i*4]>127?1:0;
 const INF=1e9,r2=Math.SQRT2;
 const dist=src=>{const d=new Float32Array(GW*GH);for(let i=0;i<d.length;i++)d[i]=src[i]?0:INF;
  for(let y=0;y<GH;y++)for(let x=0;x<GW;x++){const i=y*GW+x;let v=d[i];if(x>0)v=Math.min(v,d[i-1]+1);if(y>0){v=Math.min(v,d[i-GW]+1);if(x>0)v=Math.min(v,d[i-GW-1]+r2);if(x<GW-1)v=Math.min(v,d[i-GW+1]+r2)}d[i]=v}
  for(let y=GH-1;y>=0;y--)for(let x=GW-1;x>=0;x--){const i=y*GW+x;let v=d[i];if(x<GW-1)v=Math.min(v,d[i+1]+1);if(y<GH-1){v=Math.min(v,d[i+GW]+1);if(x<GW-1)v=Math.min(v,d[i+GW+1]+r2);if(x>0)v=Math.min(v,d[i+GW-1]+r2)}d[i]=v}
  return d};
 const sea=new Uint8Array(land.length);for(let i=0;i<land.length;i++)sea[i]=land[i]?0:1;
 const dLand=dist(land),dSea=dist(sea);
 for(let i=0;i<SDF.length;i++)SDF[i]=land[i]?-Math.min(dSea[i],400)*CELL:Math.min(dLand[i],400)*CELL;
})();
function SD(x,z){let gx=(x-WX0)/CELL-.5,gz=(z-WZ0)/CELL-.5;gx=Math.max(0,Math.min(GW-1.001,gx));gz=Math.max(0,Math.min(GH-1.001,gz));const x0=gx|0,z0=gz|0,fx=gx-x0,fz=gz-z0,i=z0*GW+x0;return (SDF[i]*(1-fx)+SDF[i+1]*fx)*(1-fz)+(SDF[i+GW]*(1-fx)+SDF[i+GW+1]*fx)*fz}

const COL=[];const PIERS=[];
const addCircle=(x,z,r)=>COL.push({t:0,x,z,r});
const addOBB=(x,z,w,d,rot=0)=>COL.push({t:1,x,z,hw:w/2,hd:d/2,c:Math.cos(rot),s:Math.sin(rot),r:Math.hypot(w,d)/2});
function collide(p,rad){let hit=false;for(const c of COL){const dx=p.x-c.x,dz=p.z-c.z;const reach=(c.t?c.r:c.r)+rad;if(Math.abs(dx)>reach||Math.abs(dz)>reach)continue;

   p.x=c.x+nx*c.c+nz*c.s;p.z=c.z-nx*c.s+nz*c.c}}}return hit}

   const base=this.vc;

   for(let k=0;k<4;k++){const su=k===1||k===2?1:-1,sv=k>=2?1:-1;
    const lx=fx+ux*hu*su+vx*hv*sv,ly=fy+uy*hu*su+vy*hv*sv,lz=fz+uz*hu*su+vz*hv*sv;

    this.v(wx,cy+ly,wz,nwx,ny,nwz,U,V,C)}
   this.i.push(base,base+1,base+2,base,base+2,base+3)}}

function LB(ox,oz,rot=0){const c=Math.cos(rot),s=Math.sin(rot);const W=(lx,lz)=>[ox+lx*c+lz*s,oz-lx*s+lz*c];

addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();if(mapOpen)drawFull()});

/* ---------- start / end ---------- */
function beginGame(){started=true;$('start').style.display='none';document.body.classList.remove('pre');tutorialShown=true;showCard(tr(LM.air.n),tr(LM.air.c));seen.air=1;if(qi===0)setTimeout(()=>{if(!dlg.on&&started&&qi===0&&!tour.on)toast(IS_TOUCH?'🕹':'W A S D',2200)},400)}
$('go').onclick=()=>{let first=true;try{first=!localStorage.getItem('ds_seen')}catch(e){}if(first){try{localStorage.setItem('ds_seen','1')}catch(e){}openHow(beginGame)}else beginGame()};
$('howBtn').onclick=()=>openHow();$('tourBtn').onclick=()=>startTour(true);
$('eplay').onclick=()=>{$('endcard').style.display='none';document.body.classList.remove('nohud');if(tour.endMode==='tour'&&!started){endTour()}else if(tour.endMode==='tour'){endTour()}else{qi=0;passenger=null;renderQuest()}};
setVoice(voiceOn);

/* ---------- camera + frame loop ---------- */
function updateCamera(dt){const v=Pm.veh,ty=v?(v.kind==='Bus'?2.6:1.7):Pm.y+1.55;if(v&&!mouseDown&&lookId===null&&v.s>2)C.yaw=angLerp(C.yaw,v.h,Math.min(1,dt*1.6));
 const k=Math.min(1,dt*12);C.x+=(Pm.x-C.x)*k;C.y+=(ty-C.y)*k;C.z+=(Pm.z-C.z)*k;const d=C.dist*(v?(v.kind==='Bus'?2.1:1.55):1),cp=Math.cos(C.pit);
 camera.position.set(C.x-Math.sin(C.yaw)*cp*d,Math.max(.8,C.y+Math.sin(C.pit)*d),C.z-Math.cos(C.yaw)*cp*d);camera.lookAt(C.x,C.y,C.z)}
const clock=new T.Clock();let tt=0;
const mascot2=mascotModel();mascot2.g.position.set(NPCS.nadia.x+2.6,0.6,NPCS.nadia.z-1.4);mascot2.g.rotation.y=-PI/2;scene.add(mascot2.g);
function updateNPCs(dt){for(const k in NPCS){const n=NPCS[k],g=n.g,d=Math.hypot(g.position.x-Pm.x,g.position.z-Pm.z);n.ph+=dt*2;
  const near=d<11&&!tour.on;if(near&&k!=='mascot'){const tgt=Math.atan2(Pm.x-g.position.x,Pm.z-g.position.z);g.rotation.y=angLerp(g.rotation.y,tgt,Math.min(1,dt*4))}else g.rotation.y=angLerp(g.rotation.y,n.baseH,Math.min(1,dt*2));
  g.position.y=(k==='mascot'?n.y0+.25+Math.sin(n.ph)*.18:n.y0+Math.sin(n.ph*1.3)*.015);
  if(n.mdl.arms.length>1){const w=near?Math.sin(n.ph*2.1)*.25:Math.sin(n.ph)*.06;n.mdl.arms[0].rotation.x=w;n.mdl.arms[1].rotation.x=-w}
  n.label.visible=d<16&&!tour.on&&!hudHidden;if(n.mark.visible){n.mark.rotation.y+=dt*2.4;n.mark.position.y=3.4+Math.sin(n.ph*1.6)*.18}}
 mascot2.g.position.y=.6+Math.sin(tt*2)*.15}
function frame(){requestAnimationFrame(frame);const dt=Math.min(clock.getDelta(),.05);tt+=dt;
 if(tour.on)updateTour(dt);
 else if(started&&!mapOpen&&!howOpen){if(dlg.on){if(Pm.veh)drive(Pm.veh,dt,true)}else{updatePlayer(dt);updateQuests(dt);updateLandmarks()}updateCamera(dt)}
 else{if(!started){C.yaw+=dt*.14;C.x=Pm.x;C.z=Pm.z;C.y=1.6;C.dist=11;updateCamera(dt)}}
 if(!started&&!tour.on)PL.g.position.set(Pm.x,0,Pm.z),PL.g.rotation.y=Pm.h;
 if(Pm.veh&&dlg.on)poseVeh(Pm.veh,0);
 updateNPCs(dt);updateEnv(dt);
 seaU.t.value=tt;seaU.fN.value=scene.fog.near;seaU.fF.value=scene.fog.far;
 if(FERRIS){FERRIS.g.rotation.z+=dt*.1;FERRIS.cabins.forEach(c=>c.rotation.z=-FERRIS.g.rotation.z)}
 const mt=mk.userData.mat;mt.opacity=.3+.15*Math.sin(tt*4);mk.rotation.y+=dt;
 sky.position.copy(camera.position);const so=E.off.clone().normalize().multiplyScalar(1250);sunDisc.position.copy(camera.position).add(so);sunDisc.material.color.set(envName==='night'?0xcfd8ff:envName==='sunset'?0xffb070:0xfff0c0);sunDisc.scale.setScalar(envName==='night'?.55:1);
 if(!tour.on){sun.target.position.set(Pm.x,0,Pm.z);sun.position.set(Pm.x+E.off.x,E.off.y,Pm.z+E.off.z)}
 if(started&&!tour.on&&!hudHidden){updateHUD();drawMini(tt)}
 renderer.render(scene,camera)}

/* ---------- boot ---------- */
$('qm').dir='ltr';applyLang();document.body.classList.add('pre');renderQuest();
(function parseHash(){const h=location.hash.slice(1).split('&').reduce((o,s)=>{const [k,v]=s.split('=');o[k]=v===undefined?1:v;return o},{});
 if(h.lang&&LANGS.includes(h.lang)){lang=h.lang;applyLang()}if(h.t&&ENV[h.t])setEnv(h.t,true);
 if(h.q!==undefined){const n=clamp(parseInt(h.q)||0,0,QS.length);for(let i=0;i<n;i++){const q=QS[i];if(q.board)passenger=q.board;if(q.drop)passenger=null}qi=n;renderQuest();const tg=SPOT.travel.find(x=>x.k===({0:'air',1:'air',2:'naama',3:'naama',4:'naama',5:'market',6:'soho',7:'soho',8:'soho',9:'soho',10:'ras'})[n]);if(tg){Pm.x=tg.x;Pm.z=tg.z;C.x=Pm.x;C.z=Pm.z}}
 if(h.go){beginGame()}if(h.tour){startTour(true)}})();
$('loading').style.display='none';frame();

window.__ds={Pm,C,K,QS,NPCS,VEH,SPOT,tour,dlg,P,LM,SD,COL,PIERS,startDialog,doAction,enterVehicle,exitVehicle,teleport,setEnv,openMap,closeMap,startTour,beginGame,applyLang,cycleLang,completeQuest,state:()=>({qi,score,passenger,started,lang,envName,arriving}),setLang:l=>{lang=l;applyLang()},setQ:n=>{qi=n;renderQuest()}};

}
setTimeout(function(){try{boot()}catch(e){var l=document.getElementById('ltxt');if(l)l.textContent='Error: '+e.message;console.error(e)}},60);

</script>
</body></html>
